version: '3.8'

services:
  odoo:
    build: .
    container_name: coplastic-odoo
    depends_on:
      - db
    ports:
      - "8029:8069"
      - "8030:8072"  # Live chat
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    environment:
      - HOST=db
      - USER=coplastic2026
      - PASSWORD=coplastic2026
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: coplastic-odoo-db
    environment:
      - POSTGRES_USER=coplastic2026
      - POSTGRES_PASSWORD=coplastic2026
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

volumes:
  odoo-data:
  postgres-data: